[package]
name = "nexus-network"
version = "1.0.0"
description = "Zoar Command Center — Nexus Network Desktop App"
authors = ["Zoar"]
edition = "2021"

[lib]
name = "nexus_network_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
