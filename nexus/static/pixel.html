<!-- ====================================================================== -->
<!-- LEAD FORM SUBMISSION — Lead event with dedup event_id                  -->
<!-- ====================================================================== -->
<script>
// Add this to your form submission handler
// IMPORTANT: Generate a unique event_id and send the SAME ID to your server
// for CAPI deduplication (prevents double-counting)
function trackLeadSubmission(formData) {
  var eventId = 'lead_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

  fbq('track', 'Lead', {
    content_name: 'Quote Request',
    content_category: formData.event_type || 'General',
    value: 1100.00,
    currency: 'USD'
  }, {eventID: eventId});

  // Send the same event_id to your server for CAPI deduplication
  // Include it in the form data sent to your backend
  formData.pixel_event_id = eventId;
  return formData;
}
</script>

<script>
// Add onclick to your phone/text links:
// <a href="tel:4242358979" onclick="trackContact('phone')">Call Us</a>
// <a href="sms:4242358979" onclick="trackContact('sms')">Text Us</a>
function trackContact(method) {
  fbq('track', 'Contact', {
    content_name: method === 'phone' ? 'Phone Call' : 'Text Message',
    content_category: 'Direct Contact'
  });
}
</script>
