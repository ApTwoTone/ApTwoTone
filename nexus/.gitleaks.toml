[allowlist]
description = "Allowlist for Nexus"
paths = [
    '''\.nexus/config\.json''',
    '''node_modules''',
    '''tests/test_security_gates\.py''',
]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8,}/B[a-zA-Z0-9_]{8,}/[a-zA-Z0-9_]{24,}'''

[[rules]]
id = "telegram-token"
description = "Telegram Bot Token"
regex = '''[0-9]+:AA[A-Za-z0-9_\-]{33,}'''

[[rules]]
id = "facebook-token"
description = "Facebook Token"
regex = '''EAA[a-zA-Z0-9]{20,}'''

[[rules]]
id = "anthropic-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9\-]{20,}'''
